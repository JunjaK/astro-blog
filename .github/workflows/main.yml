# eslint-disable yaml/plain-scalar
name: Astro Blog

on:
  workflow_dispatch:
  push:
    branches:
      - prd/blog
    paths:
      - 'blog/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache bun dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            blog/node_modules
            ~/.bun/install/cache
          key: gh-bun-${{ hashFiles('blog/bun.lock') }}
          restore-keys: |
            gh-bun-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: blog/dist
          retention-days: 1

  deploy:
    # raspi4 로 고정. `self-hosted` 만 쓰면 junserver(x64) 에도 잡히는데, 이 잡은 RPi 의
    # /home/jun/blog-files 볼륨과 :4321 nginx 를 전제로 한다 — 다른 머신에 뜨면 안 된다.
    runs-on: [self-hosted, raspi4]
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            blog/Dockerfile
            blog/nginx.conf
          sparse-checkout-cone-mode: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: blog/dist

      - name: Build Docker image
        run: DOCKER_BUILDKIT=1 docker build -t astro-blog blog

      - name: Deploy container
        run: |
          docker stop astro-blog 2>/dev/null && docker rm astro-blog 2>/dev/null || true
          docker run -d -v /home/jun/blog-files:/home/files --name astro-blog -p 4321:80 astro-blog

      - name: Delete build artifact
        if: always()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: dist
